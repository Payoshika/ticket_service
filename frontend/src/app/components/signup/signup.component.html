<div class="signin">
  <h3>Signup</h3>
  <form (ngSubmit)="onSubmit(signupForm)" #signupForm="ngForm">
    <div>
      <label for="name">name</label>
      <input type="text" id="name" name="name" [(ngModel)]="name" required />
    </div>
    <div>
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        required
      />
    </div>
    <div>
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
      />
    </div>
    <button type="submit">Signup</button>
  </form>
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>
  <div>
    <p>
      Already have an account?
      <a routerLink="/signin"><strong>Signin here</strong></a>
    </p>
  </div>
</div>
